title: "Transports du Futur"
description: "Vingt ans d'explorations des mobilités, des communs et des véhicules intermédiaires : cinq blogs réunis (2009-2026)"
baseurl: "/blog"
url: "https://gabrielplassat.github.io"

author:
  name: "Gabriel Plassat"

theme: minima
permalink: /:year/:month/:title/
timezone: Europe/Paris
lang: fr
encoding: utf-8

paginate: 20
paginate_path: "/page/:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-redirect-from

header_pages:
  - themes.md
  - recents.md
  - ciel.html
  - terre.html
  - temps.html
  - about.md

twitter:
  username: gabrielplassat

markdown: kramdown
kramdown:
  input: GFM

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor